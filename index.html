<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title> for Lia 🍪 </title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
  <style>
    body {
      margin: 0; min-height: 100vh; background: #0a0a0a;
      display: grid; place-items: center; font-family: monospace;
    }
    .window {
      width: min(900px, 92vw); border: 1px solid #333; border-radius: 10px;
      overflow: hidden; box-shadow: 0 0 40px rgba(0, 255, 100, 0.15);
    }
    .bar {
      background: #1c1c1c; padding: 8px 12px; display: flex;
      align-items: center; gap: 8px; color: #888; font-size: 13px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }
    .title { margin-left: 8px; }
    .screen { background: #000; padding: 8px; min-height: 400px; }
  </style>
</head>
<body>
  <div class="window">
    <div class="bar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="title">lia@wifebun: ~/mos_heart/secret.py </span>
    </div>
    <div class="screen">
      <script type="py" src="./script.py" terminal worker></script>
    </div>
  </div>
</body>
</html>
